[package]
name = "autocomplete-rs"
version = "0.1.0"
edition = "2021"
authors = ["zeayush"]
description = "Fast autocomplete engine with a compressed trie, typo tolerance, and multi-tenant namespaces."
license = "MIT"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "timeout"] }

# storage
rocksdb = "0.22"

# concurrency helpers
dashmap = "6"
parking_lot = "0.12"

# serde / json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# error handling
thiserror = "1"
anyhow = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"
# Hermetic RocksDB directories for the integration tests.
tempfile = "3"
# Deterministic corpora for the benchmarks.
rand = "0.9"

[[bench]]
name = "trie_bench"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1  # keep symbols for perf profiling
